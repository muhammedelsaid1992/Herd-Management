<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأبقار">
<title>إدارة الأبقار والحظائر</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mut:#6b7785;--bd:#d5dbe2;--pri:#2e7d5b;--sec:#5b6b84;--dan:#b3402f;--in:#eef2f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1e242b;--tx:#e8edf2;--mut:#9aa6b3;--bd:#333d48;--pri:#3a9a72;--sec:#6f82a0;--dan:#d4675a;--in:#272f38}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--pri);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
main{padding:14px;max-width:720px;margin:auto}
.btn{display:block;width:100%;padding:15px;margin:0 0 10px;border:0;border-radius:10px;background:var(--sec);color:#fff;font-size:17px;font-family:inherit}
.btn.p{background:var(--pri)}.btn.d{background:var(--dan)}.btn.s{width:auto;display:inline-block;padding:11px 18px;margin:0 0 0 8px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font-size:16px;font-family:inherit}
textarea{min-height:120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:right}
th{background:var(--in);color:var(--mut);font-weight:600}
tr[data-id]{cursor:pointer}
.msg{padding:10px;border-radius:8px;background:var(--in);margin:10px 0;white-space:pre-wrap;line-height:1.7}
.ok{color:var(--pri)}.bad{color:var(--dan)}.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.pen{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.warn{color:#b7791f}
#menu{display:inline-block}
#nav{position:fixed;top:0;bottom:0;right:0;width:270px;max-width:82vw;background:var(--card);border-left:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:20;transform:translateX(105%);transition:transform .2s}
#nav.open{transform:none;box-shadow:0 0 20px rgba(0,0,0,.35)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
#ov.open{display:block}
.ni{display:block;width:100%;text-align:right;background:none;border:0;border-radius:8px;padding:12px;margin:2px 0;font-size:16px;color:var(--tx);font-family:inherit}
.ni.on{background:var(--pri);color:#fff}
.nh{font-weight:700;padding:6px 12px 12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center}
.sn{font-size:30px;font-weight:700}.sl{color:var(--mut);margin-top:4px}.ss{font-size:13px;margin-top:4px;color:var(--mut)}
.stc.ok .sn{color:var(--pri)}.stc.bad .sn{color:var(--dan)}.stc.amb .sn{color:#b7791f}.stc.sec .sn{color:var(--sec)}
@media(min-width:900px){#menu{display:none}#nav{top:60px;transform:none;box-shadow:none;width:250px}#ov{display:none!important}#shell{padding-right:250px}main{max-width:900px}}
.evd{background:none;border:1px solid var(--bd);border-radius:6px;color:var(--dan);padding:4px 8px;font-size:14px}
.chip{display:inline-block;background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:3px 10px;margin:4px 0 0 6px;font-size:13px}
th[data-sort]{cursor:pointer}
</style>
</head>
<body>
<header><button id="menu">☰</button><button id="back" style="display:none">→ رجوع</button><h1 id="ttl">برنامج إدارة الأبقار والحظائر</h1></header>
<div id="shell"><main id="app"></main></div>
<nav id="nav"></nav><div id="ov"></div>
<script>
var S={cows:[],moves:[],out:[]},KEY="cows_app_v1",mem="";
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){try{if(mem)S=JSON.parse(mem)}catch(x){}}}
function save(){var j=JSON.stringify(S);mem=j;try{localStorage.setItem(KEY,j)}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function $(i){return document.getElementById(i)}
var STAT=["فاضية","ملقحة","عشار"];
function pens(){var p={};S.cows.forEach(function(c){if(c.pen)p[c.pen]=(p[c.pen]||0)+1});return p}
function penList(){return '<datalist id="pl">'+Object.keys(pens()).map(function(p){return'<option value="'+esc(p)+'">'}).join("")+'</datalist>'}
function find(id){return S.cows.filter(function(c){return c.id===id})[0]}
function ids(t){return t.split(/[\s,،;]+/).filter(Boolean)}
var REAS=['نفوق','استبعاد مرضي','بيع','استبعاد','ذبح اضطراري','أخرى'];
function nat(a,b){return String(a).localeCompare(String(b),'ar',{numeric:true})}
function copyTo(tx,id){var m=$(id);m.style.display='block';(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){m.className='msg ok';m.textContent='تم النسخ ✓ الصقه في واتساب.'},function(){m.className='msg';m.textContent=tx})}
var INV={pen:'',seen:{},fl:{},msg:null,show:false};
function invMsg(){var m=INV.msg;return m?'<div class="msg '+m.c+'">'+esc(m.t)+'</div>':''}
function invBody(){var p=INV.pen;if(!p)return'<p class="mut">اختر الحظيرة لبدء الجرد.</p>';
var inP=S.cows.filter(function(c){return c.pen===p}),done=inP.filter(function(c){return INV.seen[c.id]}),miss=inP.filter(function(c){return!INV.seen[c.id]}),fk=Object.keys(INV.fl);
return'<p style="text-align:center;font-size:18px"><b>تم جرد '+done.length+' من '+inP.length+'</b></p><div class="card"><b>تنبيهات الجرد (غير مطابقة): '+fk.length+'</b>'+(fk.length?fk.map(function(k){return'<div class="bad">'+esc(k)+' — '+esc(INV.fl[k])+'</div>'}).join(''):'<div class="mut">لا توجد.</div>')+'</div><div class="card"><b>الناقصة (لم تُجرد): '+miss.length+'</b>'+(INV.show?(miss.length?miss.map(function(c){return'<div>'+esc(c.id)+' <span class="mut">'+esc(c.st)+'</span></div>'}).join(''):'<div class="ok">لا يوجد نقص ✓</div>'):'<div class="mut">اضغط عرض الناقصين.</div>')+'</div>'}
function scan(){var inp=$('iv'),x=inp.value.trim();if(!x)return;
if(!INV.pen){INV.msg={t:'اختر الحظيرة أولاً.',c:'bad'}}
else{var c=find(x);
if(!c){INV.fl[x]='رقم غير مسجل';INV.msg={t:'تنبيه: الرقم '+x+' غير مسجل في البرنامج — راجع الرقم (ربما خطأ)',c:'bad'}}
else if(c.pen!==INV.pen){INV.fl[x]='في الحظيرة '+(c.pen||'-');INV.msg={t:'الرقم '+x+' مسجل في الحظيرة '+(c.pen||'-')+' وليس هنا',c:'warn'}}
else if(INV.seen[x]){INV.seen[x]++;INV.fl[x]='مكرر × '+INV.seen[x];INV.msg={t:'الرقم '+x+' مكرر (تم جرده من قبل)',c:'warn'}}
else{INV.seen[x]=1;INV.msg={t:'تم جرد '+x+' ✓',c:'ok'}}}
inp.value='';$('im').innerHTML=invMsg();$('ib').innerHTML=invBody();inp.focus()}
function invReport(){var p=INV.pen,inP=S.cows.filter(function(c){return c.pen===p}),done=inP.filter(function(c){return INV.seen[c.id]}),miss=inP.filter(function(c){return!INV.seen[c.id]}),fk=Object.keys(INV.fl);
return'جرد الحظيرة '+p+' — تم جرد '+done.length+' من '+inP.length+'\nتنبيهات ('+fk.length+'):\n'+(fk.map(function(k){return'- '+k+': '+INV.fl[k]}).join('\n')||'-')+'\nالناقصة ('+miss.length+'):\n'+(miss.map(function(c){return'- '+c.id+(c.st?' ('+c.st+')':'')}).join('\n')||'-')}
var TL2=[],OSEL={},OUT={reason:'الكل',ids:''},TBLF=null;
var COLS2=[['id','رقم البقرة'],['pen','الحظيرة'],['age','العمر (يوم)'],['w','الوزن (كجم)'],['dcc','DCC'],['st','الحالة'],['date','التسجيل'],['reason','السبب'],['price','سعر البيع'],['odate','تاريخ الاستبعاد'],['onote','ملاحظات']];
function tbl2(){var l=sorted(TL2);return'<div class="row" style="margin-bottom:8px"><select id="sf"><option value="">بدون ترتيب</option>'+COLS2.map(function(x){return'<option value="'+x[0]+'"'+(SORT.f===x[0]?' selected':'')+'>ترتيب حسب: '+x[1]+'</option>'}).join('')+'</select><button class="btn" id="sd" style="margin:0;flex:0 0 auto;width:auto;padding:10px 14px">'+(SORT.d>0?'تصاعدي ▲':'تنازلي ▼')+'</button></div><div class="wrap"><table><tr><th></th>'+COLS2.map(function(x){return'<th data-sort="'+x[0]+'">'+x[1]+(SORT.f===x[0]?(SORT.d>0?' ▲':' ▼'):'')+'</th>'}).join('')+'</tr>'+l.map(function(c){return'<tr><td><input type="checkbox" class="rk" data-id="'+esc(c.k)+'"'+(OSEL[c.k]?' checked':'')+' style="width:22px;height:22px"></td><td><b>'+esc(c.id)+'</b></td><td>'+esc(c.pen)+'</td><td>'+esc(ageOf(c))+'</td><td>'+esc(c.w)+'</td><td>'+esc(dccOf(c))+'</td><td>'+esc(c.st)+'</td><td>'+esc(c.date)+'</td><td>'+esc(c.reason)+'</td><td>'+esc(c.price)+'</td><td>'+esc(c.odate)+'</td><td>'+esc(c.onote)+'</td></tr>'}).join('')+'</table></div><p class="mut">حدد الأبقار بالمربع ثم اضغط إرجاع للقطيع. العدد: '+l.length+'</p>'}
function outList(){var l=S.out.slice(),ix=ids(OUT.ids);if(OUT.reason!=='الكل')l=l.filter(function(c){return c.reason===OUT.reason});if(ix.length)l=l.filter(function(c){return ix.indexOf(c.id)>=0});return l}
function outRes(){var l=outList();TL2=l;TBLF=tbl2;if(!l.length)return'<p class="mut">لا يوجد بقر مستبعد.</p>';
var cnt={};l.forEach(function(c){cnt[c.reason]=(cnt[c.reason]||0)+1});
return'<div>'+Object.keys(cnt).map(function(k){return'<span class="chip">'+esc(k)+': <b>'+cnt[k]+'</b></span>'}).join('')+'</div><div id="tw" style="margin-top:8px">'+tbl2()+'</div><div class="row" style="margin-top:12px"><button class="btn s" id="orst" style="margin:0;background:var(--pri)">إرجاع للقطيع</button><button class="btn s" id="ocp" style="margin:0">نسخ التقرير</button></div>'}
function invView(){return'<label>اختر الحظيرة</label><select id="ip"><option value="">—</option>'+opts(Object.keys(pens()).sort(nat),INV.pen)+'</select><label>رقم البقرة (اكتب الرقم واضغط Enter)</label><div class="row"><input id="iv" autocomplete="off" enterkeyhint="done"><button class="btn p s" id="ia" style="flex:0 0 auto;margin:0;width:auto">إضافة</button></div><div id="im" style="margin-top:10px">'+invMsg()+'</div><div id="ib">'+invBody()+'</div><div class="row" style="margin-top:12px"><button class="btn s" id="irs" style="margin:0">إعادة الجرد</button><button class="btn s" id="ish" style="margin:0">عرض الناقصين</button><button class="btn p s" id="icp" style="margin:0">نسخ التقرير</button></div><div class="msg" id="icm" style="display:none"></div>'}
function delView(){var c=find(A);if(!c)return'<p class="bad">البقرة غير موجودة.</p>';return'<div class="card"><h3 style="margin:0">البقرة رقم '+esc(c.id)+'</h3><div class="mut">الحظيرة: '+esc(c.pen||'-')+' • الحالة: '+esc(c.st||'-')+'</div></div><label>سبب الحذف</label><select id="dr">'+opts(REAS)+'</select><label>تاريخ الحذف</label><input id="dd" type="date" value="'+today()+'"><label>سعر البيع (للبيع فقط)</label><input id="dp" type="number" inputmode="decimal"><label>ملاحظات</label><input id="dnt"><div style="margin-top:16px"><button class="btn d s" id="cdel" style="margin:0">تأكيد الحذف</button><button class="btn s" id="cnl">إلغاء</button></div>'}
function outView(){return'<label>نوع الاستبعاد</label><select id="or"><option>الكل</option>'+opts(REAS,OUT.reason)+'</select><label>رقم البقرة (أو عدة أرقام)</label><div class="row"><input id="oi" value="'+esc(OUT.ids)+'"><button class="btn p s" id="os" style="flex:0 0 auto;margin:0;width:auto">بحث</button></div><div id="ores" style="margin-top:12px">'+outRes()+'</div><div class="msg" id="omsg" style="display:none"></div>'}
var SORT={f:'',d:1},TL=[];
var COLS=[['id','رقم البقرة'],['pen','الحظيرة'],['age','العمر (يوم)'],['w','الوزن (كجم)'],['dcc','DCC'],['st','الحالة'],['due','الولادة المتوقعة'],['date','التسجيل']];
function sv(c,f){if(f==='age')return parseFloat(ageOf(c));if(f==='dcc')return parseFloat(dccOf(c));if(f==='w'||f==='price')return parseFloat(c[f]);if(f==='due'){var r=rem(c);return r===null?NaN:r}return c[f]==null?'':String(c[f])}
function emp(x){return x===''||(typeof x==='number'&&isNaN(x))}
function sorted(l){if(!SORT.f)return l;var f=SORT.f,d=SORT.d;return l.slice().sort(function(a,b){var x=sv(a,f),y=sv(b,f),xe=emp(x),ye=emp(y);if(xe&&ye)return 0;if(xe)return 1;if(ye)return -1;if(typeof x==='number')return(x-y)*d;return String(x).localeCompare(String(y),'ar',{numeric:true})*d})}
function tbl(){var l=sorted(TL);return'<div class="row" style="margin-bottom:8px"><select id="sf"><option value="">بدون ترتيب</option>'+COLS.map(function(x){return'<option value="'+x[0]+'"'+(SORT.f===x[0]?' selected':'')+'>ترتيب حسب: '+x[1]+'</option>'}).join('')+'</select><button class="btn" id="sd" style="margin:0;flex:0 0 auto;width:auto;padding:10px 14px">'+(SORT.d>0?'تصاعدي ▲':'تنازلي ▼')+'</button></div><div class="wrap"><table><tr>'+COLS.map(function(x){return'<th data-sort="'+x[0]+'">'+x[1]+(SORT.f===x[0]?(SORT.d>0?' ▲':' ▼'):'')+'</th>'}).join('')+'</tr>'+l.map(function(c){return'<tr data-id="'+esc(c.id)+'"><td><b>'+esc(c.id)+'</b></td><td>'+esc(c.pen)+'</td><td>'+esc(ageOf(c))+'</td><td>'+esc(c.w)+'</td><td>'+esc(dccOf(c))+'</td><td>'+esc(c.st)+'</td><td>'+esc(dueDate(c))+'</td><td>'+esc(c.date)+'</td></tr>'}).join('')+'</table></div><p class="mut">اضغط على الصف لفتح بيانات البقرة، أو على عنوان العمود للترتيب. العدد: '+l.length+'</p>'}
function table(l){if(!l.length)return'<p class="mut">لا توجد نتائج.</p>';TL=l;TBLF=tbl;return'<div id="tw">'+tbl()+'</div>'}
function avg(l,f){var n=l.map(f).filter(function(x){return!isNaN(x)});return n.length?(n.reduce(function(a,b){return a+b},0)/n.length).toFixed(1):'-'}
function stats(l){var cnt={};l.forEach(function(c){var k=c.st||'غير محدد';cnt[k]=(cnt[k]||0)+1});
var ks=STAT.filter(function(k){return cnt[k]}).concat(Object.keys(cnt).filter(function(k){return STAT.indexOf(k)<0}));
var pg=l.filter(function(c){return c.st==='عشار'});
return'<div class="mut" style="line-height:1.9">متوسط الوزن: <b>'+avg(l,function(c){return parseFloat(c.w)})+'</b> كجم<br>متوسط العمر: <b>'+avg(l,function(c){return parseFloat(ageOf(c))})+'</b> يوم<br>متوسط أيام الحمل (للعشار): <b>'+avg(pg,function(c){return parseFloat(dccOf(c))})+'</b> يوم</div><div style="margin-top:6px">'+ks.map(function(k){return'<span class="chip">'+esc(k)+': <b>'+cnt[k]+'</b></span>'}).join('')+'</div>'}
function sumView(){if(!S.cows.length)return'<p class="mut">لا توجد أبقار بعد.</p>';var g={};S.cows.forEach(function(c){var k=c.pen||'بدون حظيرة';(g[k]=g[k]||[]).push(c)});
var k=Object.keys(g).sort(function(a,b){return a.localeCompare(b,'ar',{numeric:true})});
return'<div class="card"><div class="pen"><b>إجمالي المزرعة</b><b>'+S.cows.length+' بقرة • '+k.length+' حظيرة</b></div>'+stats(S.cows)+'</div>'+k.map(function(n){return'<div class="card" data-pen="'+esc(n)+'" style="cursor:pointer"><div class="pen"><span>'+(n==='بدون حظيرة'?n:'حظيرة '+esc(n))+'</span><b>'+g[n].length+' بقرة</b></div>'+stats(g[n])+'</div>'}).join('')+'<p class="mut">اضغط على الحظيرة لعرض أبقارها.</p>'}
function opts(a,sel){return a.map(function(x){return'<option'+(x===sel?" selected":"")+'>'+esc(x)+'</option>'}).join("")}
var V="home",A=null;
function go(v,a){V=v;A=a||null;SORT={f:"",d:1};OSEL={};render();window.scrollTo(0,0)}
function render(){var h="",t="برنامج إدارة الأبقار والحظائر";$("back").style.display=V==="home"?"none":"";
if(V==="home"){h=homeView()}
else if(V==="add"){t="تسجيل بقرة جديدة";h=form({date:today()},true)}
else if(V==="edit"){t="بيانات بقرة / تعديل";var c=A&&find(A);h='<label>رقم البقرة (Cow ID)</label><div class="row"><input id="lid" value="'+esc(A||"")+'"><button class="btn p s" id="ld" style="flex:0 0 auto;margin:0">تحميل</button></div><div id="fm">'+(c?form(c,false):'<p class="mut">اكتب رقم البقرة واضغط تحميل.</p>')+'</div>'+(c?mvlog(c.id)+cowHist(c.id):'')}
else if(V==="br"){t="التلقيح والولادة";h=brView()}
else if(V==="hl"){t="العلاج والتحصين";h=hlView()}
else if(V==="wt"){t="تسجيل الأوزان";h=wtView()}
else if(V==="al"){t="التنبيهات";h=alView()}
else if(V==="io"){t="استيراد / تصدير Excel";h=ioView()}
else if(V==="inv"){t="جرد الحظائر";h=invView()}
else if(V==="del"){t="حذف بقرة";h=delView()}
else if(V==="out"){t="البقر المستبعد";h=outView()}

function cond(p,n){return'<div class="card"><label style="margin-top:0">شرط '+n+'</label><select id="'+p+'c"><option>بدون شرط</option><option>أكبر من</option><option>أقل من</option><option>بين</option></select><div class="row"><div><label>القيمة</label><input id="'+p+'1" type="number" inputmode="decimal"></div><div><label>إلى (لـ بين)</label><input id="'+p+'2" type="number" inputmode="decimal"></div></div></div>'}
